# Blank issues stay enabled: a report that fits no template is still worth
# having, and a closed template list is how edge cases go unreported.
blank_issues_enabled: true
contact_links:
  - name: Security disclosure (private)
    url: https://github.com/squillo/aph/security/advisories/new
    about: >-
      Report a vulnerability privately here — never as a public issue.
      SECURITY.md at the repository root states scope, the response window,
      and the disclosure terms. Read the threat model first
      (spec/security-considerations.md) — §2 lists what APH defends against
      and §3 what it deliberately does not.
