name: TypeScript interpreter

# The independent implementation runs BESIDE the Rust suite, never inside it.
# Neither stack invokes the other: both read committed bytes, which is what
# keeps the cross-verification a protocol result rather than a build-pipeline
# result. `examples/**` is in the path filter because a new or regenerated
# vector changes what this suite must admit — the corpus harness fails on any
# example file it has no expectation for.
#
# The harness paths below belong to THIS workflow and not to the Rust one:
# `aph-js-harness` consumes the tsc output, so the thing that must rebuild
# before it runs is this job's build step. Naming its crate directory, the
# workspace manifest and the lockfile is what keeps an engine-version bump or a
# harness edit from reaching main without ever scheduling the job that runs it.
#
# `spec/**` is in the filter because this suite is the ONLY thing in the
# repository that enforces the spec's closed value sets (channel kinds,
# content classes) at parse time. Before it was listed, a commit editing only
# the spec never scheduled this job — so the normative enum could widen in
# one green PR while the sole enforcing implementation stayed narrow, and the
# divergence landed with every checkmark green.
on:
  push:
    branches: [main]
    paths:
      - "interpreters/typescript/**"
      - "interpreters/rust/aph-js-harness/**"
      - "interpreters/rust/Cargo.toml"
      - "interpreters/rust/Cargo.lock"
      - "examples/**"
      - "spec/**"
      - ".github/workflows/typescript.yml"
  pull_request:
    branches: [main]
    paths:
      - "interpreters/typescript/**"
      - "interpreters/rust/aph-js-harness/**"
      - "interpreters/rust/Cargo.toml"
      - "interpreters/rust/Cargo.lock"
      - "examples/**"
      - "spec/**"
      - ".github/workflows/typescript.yml"

# Least privilege: this workflow only reads the tree.
permissions:
  contents: read

jobs:
  test:
    name: tsc + node --test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor: it is the first release where SubtleCrypto exposes
        # Ed25519, which every signature in this implementation goes through.
        # 22 is the current LTS. Both are run because a platform crypto change
        # is exactly the kind of thing one version would hide.
        node: ["20", "22"]
    defaults:
      run:
        working-directory: interpreters/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # `npm install` rather than `npm ci`: there is no lockfile to install
      # from, and there is no lockfile because there is nothing to lock — the
      # only dependency in the tree is the TypeScript compiler, and it is a
      # dev-time one. The dependency claim is checked below rather than
      # trusted.
      - name: Install the compiler (the only dependency)
        run: npm install --no-audit --no-fund
      - name: Assert the dependency claim
        # A runtime dependency appearing here would quietly break the
        # implementation's central claim: spec in, verdict out, on the
        # platform's own crypto and nothing else.
        run: |
          set -euo pipefail
          if node -e 'const p=require("./package.json");process.exit(p.dependencies&&Object.keys(p.dependencies).length?1:0)'; then
            echo "runtime dependencies: none"
          else
            echo "::error::package.json declares runtime dependencies; this package must have none"
            exit 1
          fi
      - name: Type-check and build
        run: npm run build
      - name: Run the suite
        run: npm test

  second-engine:
    # A SEPARATE job rather than a step in the matrix above, and the separation
    # is the point: this run contains no Node at all beyond the compiler that
    # produced `dist/`. Bolting it onto the matrix would run one engine's
    # conformance check twice, once per Node version, and would read as though
    # the result depended on which Node was installed. It does not — that
    # independence is the whole claim.
    name: second ECMAScript engine (cargo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # One Node version, used only to RUN tsc. Nothing in this job executes
      # JavaScript on Node: the suite under test runs inside the Rust process.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the compiler (the only dependency)
        working-directory: interpreters/typescript
        run: npm install --no-audit --no-fund
      # The harness reads build OUTPUT, so this step is its prerequisite. Its
      # tests fail with a BUILD FIRST message when `dist/` is absent rather than
      # with a module-resolution error, which is what makes a broken build step
      # legible here instead of looking like a broken harness.
      - name: Type-check and build
        working-directory: interpreters/typescript
        run: npm run build
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: interpreters/rust
      # Named explicitly because the crate is outside `default-members`: the
      # bare `cargo test` in the Rust workflow never reaches it, and must not.
      - name: Run the compiled core under the second engine
        working-directory: interpreters/rust
        run: cargo test -p aph-js-harness
      # The byte-identity rig compares the canonical fixed-point of every
      # corpus file between the reference and the compiled TS core under the
      # second engine. Elsewhere its TS half skips ANNOUNCED when `dist/` is
      # absent; this job just built dist, so here a skip would be silent
      # coverage loss — the flag turns it into a failure instead.
      - name: Byte-identity rig, TS half required
        working-directory: interpreters/rust
        env:
          APH_BYTE_RIG_REQUIRE_TS: "1"
        run: cargo test -p aph-conformance --test byte_identity_test
