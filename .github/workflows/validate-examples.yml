name: Validate examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: jq and grep over a checkout need nothing writable.
permissions:
  contents: read

jobs:
  json-syntax-check:
    name: JSON syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate every example JSON file parses
        run: |
          set -e
          # `find`, not `examples/*.json`, because the top-level glob silently
          # skipped every example that lives in its own directory — the first
          # such example shipped four unvalidated JSON files. A syntax check
          # that does not see a file is indistinguishable from one that passes.
          count=0
          while IFS= read -r f; do
            jq empty "$f"
            count=$((count + 1))
          done < <(find examples -name '*.json' -type f | sort)
          echo "Parsed $count JSON files under examples/."

      - name: Every example is classified by the manifest, and every classification exists
        run: |
          set -e
          # WHY THIS REPLACED A FLOOR. The check above used to end with
          # `[ "$count" -lt 7 ]` — a floor of seven against sixteen real files,
          # which could not fail for any reachable state of the tree. A floor
          # cannot see a vector ADDED and never classified, and cannot see one
          # file swapped for another, because neither moves the count.
          #
          # examples/manifest.json is the ONE inventory: `conformance` lists the
          # vectors every implementation must admit, `excluded` lists files that
          # live here for other reasons (an A2A transport request, an AgentCard,
          # a hashed body, a deliberately non-conformant illustration) with the
          # reason stated per entry. Set equality in BOTH directions is what
          # makes adding a vector a deliberate two-file change: a file nobody
          # classified fails, and a classification whose file vanished fails.
          #
          # Every binding's own suite performs this same comparison in its own
          # language; this job is the one that runs on a docs-only commit, when
          # none of the language workflows are scheduled at all.
          jq empty examples/manifest.json
          jq -r '.conformance[], (.excluded[] | .path)' examples/manifest.json | sort > /tmp/claimed.txt
          find examples -name '*.json' -type f ! -name manifest.json \
            | sed 's|^examples/||' | sort > /tmp/on_disk.txt

          if ! diff -u /tmp/claimed.txt /tmp/on_disk.txt > /tmp/corpus.diff; then
            echo "::error::examples/manifest.json and the files on disk disagree — lines starting '-' are claimed but absent, lines starting '+' are present but unclassified"
            cat /tmp/corpus.diff >&2
            exit 1
          fi
          echo "Manifest and corpus agree exactly ($(wc -l < /tmp/on_disk.txt) files)."

  sanitization-check:
    name: Sanitization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Grep for forbidden strings
        run: |
          # Three groups, and the second and third exist because the first was
          # not enough. Group 1 (authorship markers) was the original list.
          #
          # Group 2 — CITATIONS TO INTERNAL NUMBERING SYSTEMS. Added after four
          # leaks reached this public repository unnoticed: a knowledge-base
          # citation in a test comment, three more in the specification Snapp
          # sources, and an internal ticket ID inside the sample message text of
          # a published example envelope. None matched the original list. The
          # generalization worth keeping is that the leak shape is a REFERENCE
          # TO AN INTERNAL NUMBERING SCHEME, so each scheme needs its own
          # pattern — enumerating brand names alone will keep missing them.
          # Fixture and sample text is the highest-risk surface, because it
          # reads as filler and nobody re-reads it.
          #
          # Group 3 — INTERNAL COMPONENT AND TOOL NAMES, including developer
          # filesystem paths.
          #
          # DELIBERATELY ABSENT: `Snapp` and `N Lang`. Both are public,
          # documented, and licensed in the README; adding them would fail every
          # push for content that is meant to be here.
          forbidden='Claude|Anthropic|Co-Authored-By|Generated with|@AI|claude\.ai|noreply@anthropic\.com|PRDs/|_recon/|MEMORY\.md'
          forbidden="$forbidden"'|PRD-[0-9]|N_BOOK|SQUILLO_BOOK|BOOK [0-9]+/[0-9]+|Book [0-9]+/[0-9]+'
          forbidden="$forbidden"'|/Users/|squillo_[a-z]|recon_spec|hexser|STRATAFORM|D-Wire|stc intel'
          # `git grep`, not `grep -r`, so this scans TRACKED FILES ONLY.
          # A fresh CI clone has no build output, but a developer running the
          # same command locally does — and the language toolchain writes
          # absolute source paths and sibling-project names into
          # `APH Spec/*/build/`, which is gitignored and therefore never
          # published. With `grep -r` the two runs disagree: CI passes while
          # the local check drowns in false positives from files that cannot
          # leak, which trains people to ignore it. Tracked-only makes the
          # local run and the CI run the same check.
          #
          # `.github` is excluded because THIS FILE contains every forbidden
          # pattern as data. Keep that exclusion if the command is ever
          # rewritten, or the check fails on itself.
          rc=0
          git grep -nE "$forbidden" -- . ':(exclude).github' || rc=$?
          # `crates/` is checked separately with a carve-out, because the one
          # pattern has two meanings: `crates/<name>` as a bare path is an
          # internal workspace layout leaking (the thing this list exists to
          # stop), while `crates.io/crates/<name>` is the public registry URL
          # of this project's own published crates — the splash page and the
          # README legitimately carry it. grep -E has no lookbehind, so the
          # carve-out is a filter: flag `crates/` hits, drop the lines whose
          # hit is part of a crates.io URL, fail on what remains. Found the
          # hard way: the splash page's crates.io link turned this job red,
          # and the redness went unnoticed for one push because the deployer
          # watched only the Pages workflow — a green that is not looked at
          # protects nothing.
          crc=0
          crates_hits=$(git grep -nE 'crates/' -- . ':(exclude).github' | grep -vE 'crates\.io/crates/') || crc=$?
          if [ "$crc" -eq 0 ] && [ -n "$crates_hits" ]; then
            echo "$crates_hits"
            echo "Sanitization FAILED - internal crates/ path reference (write interpreters/rust/<crate> instead)." >&2
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "Sanitization FAILED - forbidden marker(s) detected above." >&2
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "Sanitization check errored (git grep exit $rc); refusing to pass." >&2
            exit "$rc"
          fi
          echo "Sanitization clean."
