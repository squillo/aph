name: Validate examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: jq and grep over a checkout need nothing writable.
permissions:
  contents: read

jobs:
  json-syntax-check:
    name: JSON syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate every example JSON file parses
        run: |
          set -e
          shopt -s nullglob
          count=0
          for f in examples/*.json; do
            jq empty "$f"
            count=$((count + 1))
          done
          if [ "$count" -lt 7 ]; then
            echo "Expected at least 7 example JSON files, found $count." >&2
            exit 1
          fi
          echo "Validated $count JSON example files."

  sanitization-check:
    name: Sanitization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Grep for forbidden strings
        run: |
          forbidden='Claude|Anthropic|Co-Authored-By|Generated with|@AI|claude\.ai|noreply@anthropic\.com|crates/|PRDs/|_recon/|MEMORY\.md'
          rc=0
          grep -rE "$forbidden" \
              --exclude-dir=.git \
              --exclude-dir=.github \
              --exclude-dir=target \
              . || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "Sanitization FAILED - forbidden marker(s) detected above." >&2
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "Sanitization check errored (grep exit $rc); refusing to pass." >&2
            exit "$rc"
          fi
          echo "Sanitization clean."
