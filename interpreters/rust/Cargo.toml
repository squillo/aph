[workspace]
resolver = "3"
members = [
  "aph-core",
  "aph-conformance",
  "aph-cli",
  "aph-resolver",
  "aph-ts",
  "aph-py",
  "aph-js-harness",
  "aph-wasm-abi",
]
# FOUR members sit outside the default set, each because RUNNING it needs
# something the protocol crates do not: aph-ts targets wasm32 and is built
# explicitly (wasm-pack / --target wasm32-unknown-unknown); aph-py links a
# Python interpreter and is named explicitly (`cargo test -p aph-py`);
# aph-js-harness runs the TypeScript implementation's BUILD OUTPUT under a
# second ECMAScript engine, so its tests need `interpreters/typescript/dist`
# on disk — plain `cargo test` must never require a Node toolchain to have
# run, and its tests say so out loud rather than failing with a module error.
#
# aph-wasm-abi is the fourth, and it is outside for a reason the other three
# only half-share: it is not a testable crate at all from here. It compiles to
# a `wasm32-unknown-unknown` artifact with a raw pointer ABI, and the only
# thing that can call that ABI is a WebAssembly runtime — the Go binding under
# `interpreters/go` embeds the compiled module and `go test` is the sole gate
# on it. Building it into a default `cargo test` would produce a cdylib for the
# HOST that nothing ever loads, which is worse than not building it: it looks
# like coverage. It is also the one member whose output must be built with a
# specific flag set to stay byte-reproducible, so it is always built by the
# recipe that owns those flags and never by an incidental workspace build.
# None of the four may become a prerequisite for testing the protocol itself.
# aph-resolver is a native crate and IS in the default set, so plain
# `cargo test` covers it.
default-members = ["aph-core", "aph-conformance", "aph-cli", "aph-resolver"]
# The Elixir binding's NIF crate is not a member and is not merely outside the
# default set: mix (through rustler) is the build driver for a NIF, and two
# build drivers pointed at one workspace member is a reliability defect — they
# disagree about target directory, profile and feature unification, and cargo
# would produce an artifact mix then rebuilds anyway. Excluding it only from
# `default-members` — the shape aph-ts and aph-py use — half-solves that,
# because an explicit `-p` or a `--workspace` flag still reaches a member.
#
# Enforcement is layered because no single mechanism covers every entry point:
# the crate lives outside this directory tree, so cargo never discovers it from
# here; it declares its own empty `[workspace]`, so a cargo run started inside
# it cannot be absorbed by an ancestor manifest either; and this entry states
# the intent where the members list is read, so relocating the crate under this
# directory cannot quietly make it a member.
exclude = ["../elixir/native/aph_nif"]

[workspace.package]
# PRE-RELEASE while the spec still reads 0.1.0-draft. Cargo does not
# auto-select a pre-release, so an adopter opts in explicitly — and 0.1.0
# stays free for the cut that follows the spec leaving draft. NOTE this is the
# CRATE version and is deliberately distinct from the PROTOCOL version
# (`aph_config::APH_VERSION = "0.1"`, guard-tested); they move independently.
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
authors = ["APH Protocol Contributors"]
repository = "https://github.com/squillo/aph"

[workspace.dependencies]
# `version` alongside `path` is REQUIRED to publish: cargo refuses a path
# dependency with no version ("all path dependencies must have a version"),
# and the published crate carries the version while local builds keep using
# the path. Keep it equal to workspace.package.version.
aph-core = { path = "aph-core", version = "0.1.0-alpha.1" }
aph-conformance = { path = "aph-conformance" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
p256 = { version = "0.13", features = ["ecdsa"] }
# eddsa-jcs-2022, §8.1's first MUST-support algorithm and the cryptosuite most
# published examples declare. Deliberately count-free: the corpus grows, and a
# number here would be a second place to keep swept. The other two §8.1/§8.2
# paths — ecdsa-jcs-2019 and the detached-JWS carriage — run on `p256` above.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# Already in the lockfile via ed25519-dalek — naming it adds no new supply
# chain. Used only by the conformance suite's recipient-side body-hash check.
sha2 = "0.10"
# multibase base58btc: proofValue encoding and did:key identifiers.
bs58 = "0.5"
base64 = "0.22"
proptest = "1.5"
# ── I/O stack: linked ONLY by aph-resolver ─────────────────────────────
# Every entry below exists so ONE crate can carry the DNS + HTTPS adapters
# for adopters who have no host transport of their own. aph-core,
# aph-conformance and aph-cli MUST NOT gain a dependency edge to any of
# them — that separation is what keeps `cargo test -p aph-core` runnable
# with no network and no async runtime.
# Linked ONLY by aph-resolver: the executor its two adapters run under.
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
# Linked ONLY by aph-resolver: the §8.4.5 DNS TXT query.
hickory-resolver = "0.24"
# Linked ONLY by aph-resolver: the §8.4.4 did:web document fetch. `stream`
# is not decoration — `Response::bytes_stream` is gated behind it, and the
# 64 KiB cap must abort mid-body rather than read-then-measure.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# Linked ONLY by aph-resolver: `StreamExt::next` over that body stream.
futures-util = { version = "0.3", default-features = false }
wasm-bindgen = "0.2"
# The wasm smoke harness (aph-ts); the JS boundary itself is JSON text in
# both directions, so there is deliberately no serde-wasm-bindgen here.
wasm-bindgen-test = "0.3"
