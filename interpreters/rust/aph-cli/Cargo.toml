[package]
name = "aph-cli"
description = "Command-line tool for validating and inspecting APH notarization envelopes"
# Not published: the `aph-cli` name on crates.io belongs to an unrelated
# crate. Build from source, or run via `cargo run -p aph-cli`.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "aph"
path = "src/main.rs"

[dependencies]
aph-core = { workspace = true }
aph-conformance = { workspace = true }
serde_json = { workspace = true }
# Already in the lockfile via aph-core — naming it adds no new supply chain.
# Used only to derive `Serialize` for the `validate --json` verdict, so that
# shape's field order and its omit-when-absent rule are declared once on the
# struct rather than assembled by hand at every call site.
serde = { workspace = true }
