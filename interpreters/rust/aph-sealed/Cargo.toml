# The reference implementation of RFC 0008 sealed payloads (Accepted,
# spec/aph-0.2.md §1-§4): HPKE seal/unseal under the context AAD, plus the
# envelope-level operations. Wire TYPES live in aph-core; this crate holds
# the cryptography, so verifiers that never open a seal never link it. A
# v0.1-only verifier still refuses the member at strict parse — the
# compatibility story, not a defect.
[package]
name = "aph-sealed"
description = "APH sealed payloads (RFC 0008, spec v0.2): HPKE carriage without readership over aph-core envelopes"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }

[dependencies]
aph-core = { path = "../aph-core", version = "0.2.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
# RFC 9180 HPKE, pure Rust — this repository writes no cryptography. The
# single pinned suite (X25519-HKDF-SHA256 / HKDF-SHA256 / ChaCha20-Poly1305)
# is the one RFC 0008 §1 names; no other suite is compiled in.
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
# rand 0.9 to match hpke's rand_core 0.9 trait identity exactly.
rand = "0.9"

[dev-dependencies]
sha2 = "0.10"
# The signed 0.2 vectors are minted from RFC 8032 test seeds in this suite.
ed25519-dalek = { workspace = true }
